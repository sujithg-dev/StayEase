<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('403 - Access Denied')}"></head>

<body>
    <div class="error-page">
        <div class="error-card">
            <div class="error-icon error-icon-warning">
                <i class="fas fa-lock"></i>
            </div>
            <h1 class="error-code">403</h1>
            <div class="error-details">
                <h3 class="error-title">Access Denied</h3>
                <p class="error-message">You don't have permission to access this page.</p>
            </div>
            <a class="btn btn-primary" th:href="@{/main}">Back to Home</a>
        </div>
    </div>
</body>

</html>
