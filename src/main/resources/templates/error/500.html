<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Error - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>s

<body>
    <div class="error-page">
        <div class="error-card">
            <div class="error-icon error-icon-warning">
                <i class="fas fa-map-signs"></i>
            </div>
            <h1 class="error-code">500</h1>
            <div class="error-details">
                <h2 class="error-title">Something Went Wrong</h2>
                <p class="error-message">An unexpected error occurred.</p>
            </div>
            <a class="btn btn-primary" th:href="@{/main}">Back to Home</a>
        </div>
    </div>
</body>

</html>
