<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Bookings - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/manager.css}">
    <link rel="stylesheet" th:href="@{/css/table.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
    <script defer th:src="@{/js/sidebar-toggle.js}"></script>
    <script defer th:src="@{/js/table.js}"></script>
</head>

<body>
    <div class="container dashboard">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="main-content">
            <section class="section">
                <div class="empty-box" th:if="${#lists.isEmpty(allBookings)}">
                    <h2 class="title">No bookings yet!</h2>
                    <p class="subtitle">Customer bookings list will appear here.</p>
                </div>
                <div class="table-container" data-table th:if="${page.totalElements > 0 or hasFilters}">
                    <div class="table-header">
                        <div>
                            <h1 class="title">All Bookings</h1>
                            <p class="subtitle">List of all booking details</p>
                        </div>
                    </div>
                    <form class="table-filters" data-table-form>
                        <div class="search-box">
                            <span class="material-symbols-outlined icon">search</span>
                            <input type="text" name="q" th:value="${q}" placeholder="Search bookings . . .">
                        </div>
                        <div class="filter-box">
                            <span class="material-symbols-outlined icon">filter_alt</span>
                            <select class="filter-select" name="hotel">
                                <option class="default" value="">All Hotels</option>
                                <option th:each="h : ${hotels}" th:value="${h}" th:text="${#strings.capitalize(h.toLowerCase())}" th:selected="${h == hotel}"></option>
                            </select>
                        </div>
                        <div class="filter-box">
                            <span class="material-symbols-outlined icon">filter_alt</span>
                            <select class="filter-select" name="payment">
                                <option class="default" value="">All Payments</option>
                                <option th:each="p : ${paymentStatuses}" th:value="${p.name()}" th:text="${#strings.capitalize(p.name().toLowerCase())}" th:selected="${p.name() == payment}"></option>
                            </select>
                        </div>
                        <div class="filter-box">
                            <span class="material-symbols-outlined icon">filter_alt</span>
                            <select class="filter-select" name="status">
                                <option class="default" value="">All Statuses</option>
                                <option th:each="s : ${bookingStatuses}" th:value="${s.name()}" th:text="${#strings.capitalize(#strings.replace(s.name().toLowerCase(), '_', ' '))}" th:selected="${s.name() == status}"></option>
                            </select>
                        </div>
<!--                        <div class="filter-box filter-date">-->
<!--                            <span>Check-in</span>-->
<!--                            <strong> from</strong>-->
<!--                            <input class="filter-date" type="date" name="from" th:value="${from}">-->
<!--                            <strong>to</strong>-->
<!--                            <input class="filter-date" type="date" name="to" th:value="${to}">-->
<!--                        </div>-->
                        <button class="filter-reset" type="button" th:if="${hasFilters}" data-reset>Reset</button>
                    </form>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th th:replace="~{fragments/table :: sortTh('Booking ID','bookingNumber','')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('Customer','customerName','')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('Hotel','hotelName','')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('Room','roomName','center')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('Check-in','checkInDate','center')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('Check-out','checkOutDate','center')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('Rooms','totalRooms','center')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('Total Amount','totalAmount','center')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('Payment Status','paymentStatus','center')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('Booking Status','bookingStatus','center')}"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(bookings)}">
                                    <td colspan="10" style="text-align:center;padding:24px;">No matching records found</td>
                                </tr>
                                <tr th:each="booking : ${bookings}">
                                    <td>
                                        <span th:text="${booking.bookingNumber}"></span>
                                    </td>
                                    <td>
                                        <span class="name" th:text="${booking.customerName}"></span>
                                        <span class="email" th:text="${booking.customerEmail}"></span>
                                    </td>
                                    <td>
                                        <span th:text="${booking.hotelName}"></span>
                                    </td>
                                    <td class="center">
                                        <span th:text="${booking.roomName}"></span>
                                    </td>
                                    <td class="center">
                                        <span th:text="${#temporals.format(booking.checkInDate, 'dd, MMM, yyyy')}"></span>
                                    </td>
                                    <td class="center">
                                        <span th:text="${#temporals.format(booking.checkOutDate, 'dd, MMM, yyyy')}"></span>
                                    </td>
                                    <td class="center">
                                        <span th:text="${booking.totalRooms}"></span>
                                    </td>
                                    <td class="center">
                                        <span th:text="${booking.totalAmount}"></span>
                                    </td>
                                    <td class="center">
                                        <span class="status-badge" th:text="${#strings.capitalize(booking.paymentStatus.name().toLowerCase())}"></span>
                                    </td>
                                    <td class="center">
                                        <span class="status-badge" th:text="${#strings.capitalize(#strings.replace(booking.bookingStatus.name().toLowerCase(), '_', ' '))}"></span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:replace="~{fragments/table :: pagination(${page})}"></div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
