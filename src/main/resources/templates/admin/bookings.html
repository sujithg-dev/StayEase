<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Bookings - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/manager.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>
    <div class="container dashboard">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="main-content">
            <section class="section">
                <div  class="empty-box" th:if="${#lists.isEmpty(bookings)}">
                    <h2 class="title">No bookings yet!</h2>
                    <p class="subtitle">Customer bookings list will appear here.</p>
                </div>
                <div class="table-container" th:if="${!#lists.isEmpty(bookings)}">
                    <div class="table-header">
                        <div>
                            <h1 class="title">All Bookings</h1>
                            <p class="subtitle">List of all booking details</p>
                        </div>
                    </div>
                    <div class="table-filters">
                        <div class="search-box">
                            <span class="material-symbols-outlined icon">search</span>
                            <input type="text" placeholder="Search bookings . . .">
                        </div>
                    </div>
                    <div class="table-wrapper">
                        <table th:if="${!#lists.isEmpty(bookings)}">
                            <thead>
                                <tr>
                                    <th>Booking ID</th>
                                    <th>Customer</th>
                                    <th>Hotel</th>
                                    <th>Room</th>
                                    <th class="center">Check-in</th>
                                    <th class="center">Check-out</th>
                                    <th class="center">Rooms</th>
                                    <th class="center">Total Amount</th>
                                    <th class="center">Payment Status</th>
                                    <th class="center">Booking Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="booking : ${bookings}">
                                    <td>
                                        <span th:text="${booking.bookingNumber}"></span>
                                    </td>
                                    <td>
                                        <span class="name" th:text="${booking.customerName}"></span>
                                        <span class="email" th:text="${booking.customerEmail}"></span>
                                    </td>
                                    <td>
                                        <span th:text="${booking.hotelName}"></span>
                                    </td>
                                    <td class="center">
                                        <span th:text="${booking.roomType}"></span>
                                    </td>
                                    <td class="center">
                                        <span class="status-badge" th:text="${#temporals.format(booking.checkInDate, 'dd, MMM, yyyy')}"></span>
                                    </td>
                                    <td class="center">
                                        <span class="status-badge" th:text="${#temporals.format(booking.checkOutDate, 'dd, MMM, yyyy')}"></span>
                                    </td>
                                    <td class="center">
                                        <span th:text="${booking.totalRooms}"></span>
                                    </td>
                                    <td class="center">
                                        <span th:text="${booking.totalAmount}"></span>
                                    </td>
                                    <td class="center">
                                        <span class="status-badge" th:if="${booking.paymentStatus.name() == 'PAID'}" >Paid</span>
                                        <span class="status-badge" th:if="${booking.paymentStatus.name() == 'PENDING'}" >Pending</span>
                                        <span class="status-badge" th:if="${booking.paymentStatus.name() == 'FAILED'}" >Failed</span>
                                        <span class="status-badge" th:if="${booking.paymentStatus.name() == 'REFUNDED'}">Refunded</span>
                                    </td>
                                    <td class="center">
                                        <span class="status-badge" th:if="${booking.bookingStatus.name() == 'PENDING_PAYMENT'}">Payment Pending</span>
                                        <span class="status-badge" th:if="${booking.bookingStatus.name() == 'CONFIRMED'}">Confirmed</span>
                                        <span class="status-badge" th:if="${booking.bookingStatus.name() == 'COMPLETED'}">Completed</span>
                                        <span class="status-badge" th:if="${booking.bookingStatus.name() == 'CANCELLED'}">Canceled</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
