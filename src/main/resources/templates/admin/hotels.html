<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Hotels - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/manager.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>
    <div class="container dashboard">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="main-content">
            <section class="section">
                <div class="empty-box" th:if="${#lists.isEmpty(hotels)}">
                    <h2 class="title">No hotels found!</h2>
                    <p class="subtitle">Added hotels list will appear here.</p>
                </div>
                <div class="table-container" th:if="${!#lists.isEmpty(hotels)}">
                    <div class="table-header">
                        <div>
                            <h1 class="title">All Hotels</h1>
                            <p class="subtitle">All registered hotels</p>
                        </div>
                    </div>
                    <div class="table-filters">
                        <div class="search-box">
                            <span class="material-symbols-outlined icon">search</span>
                            <input type="text" placeholder="Search hotel . . .">
                        </div>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Hotel</th>
                                    <th>Manager</th>
                                    <th class="center">Rating</th>
                                    <th class="center">Status</th>
                                    <th class="center">City</th>
                                    <th class="center">State</th>
                                    <th class="center">Country</th>
                                    <th class="center">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="hotel : ${hotels}">
                                    <td>
                                        <span th:text="${hotel.hotelName}"></span>
                                    </td>
                                    <td>
                                        <span class="name" th:text="${managerNames[hotel.managerId] ?: 'Unknown'}"></span>
                                        <span class="email" th:text="${managerEmails[hotel.managerId] ?: 'Unknown'}"></span>
                                    </td>
                                    <td class="center">
                                        <span class="status-badge" th:text="${hotel.hotelRating}"></span>
                                    </td>
                                    <td class="center">
                                        <span class="status-badge" th:text="${hotel.hotelStatus}"></span>
                                    </td>
                                    <td class="center">
                                        <span th:text="${hotel.hotelCity}"></span>
                                    </td>
                                    <td class="center">
                                        <span th:text="${hotel.hotelState}"></span>
                                    </td>
                                    <td class="center">
                                        <span th:text="${hotel.hotelCountry}"></span>
                                    </td>
                                    <td class="center">
                                        <div class="row-actions">
                                            <form th:action="@{/admin/hotels/status/{id}(id=${hotel.hotelId})}" method="post">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <button class="btn btn-danger" type="submit" th:if="${hotel.hotelStatus.name() == 'ACTIVE'}">Deactivate</button>
                                                <button class="btn btn-success" type="submit" th:if="!${hotel.hotelStatus.name() == 'ACTIVE'}">Activate</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
