<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Hotels - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/manager.css}">
    <link rel="stylesheet" th:href="@{/css/table.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
    <script defer th:src="@{/js/sidebar-toggle.js}"></script>
    <script defer th:src="@{/js/table.js}"></script>
</head>

<body>
    <div class="container dashboard">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="main-content">
            <section class="section">
                <div class="empty-box" th:if="${#lists.isEmpty(allHotels)}">
                    <h2 class="title">No hotels found!</h2>
                    <p class="subtitle">Added hotels list will appear here.</p>
                </div>
                <div class="table-container" data-table th:if="${page.totalElements > 0 or hasFilters}">
                    <div class="table-header">
                        <div>
                            <h1 class="title">All Hotels</h1>
                            <p class="subtitle">List of all registered hotels</p>
                        </div>
                    </div>
                    <form class="table-filters" data-table-form>
                        <div class="search-box">
                            <span class="material-symbols-outlined icon">search</span>
                            <input type="text" name="q" th:value="${q}" placeholder="Search hotels . . .">
                        </div>
                        <div class="filter-box">
                            <span class="material-symbols-outlined icon">filter_alt</span>
                            <select name="status" class="filter-select">
                                <option class="default" value="">All Statuses</option>
                                <option th:each="s : ${hotelStatuses}" th:value="${s.name()}" th:text="${#strings.capitalize(s.name().toLowerCase())}" th:selected="${s.name() == status}"></option>
                            </select>
                        </div>
                        <button class="filter-reset" type="button" th:if="${hasFilters}" data-reset>Reset</button>
                    </form>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th th:replace="~{fragments/table :: sortTh('Hotel','hotelName','')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('Manger Name','mangerName','')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('Manger Email','mangerEmail','')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('Rating','hotelRating','center')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('Status','hotelStatus','center')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('City','hotelCity','center')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('State','hotelState','center')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('Country','hotelCountry','center')}"></th>
                                    <th class="center">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(hotels)}">
                                    <td colspan="10" style="text-align:center;padding:24px;">No matching records found</td>
                                </tr>
                                <tr th:each="hotel : ${hotels}">
                                    <td>
                                        <span th:text="${hotel.hotelName}"></span>
                                    </td>
                                    <td>
                                        <span th:text="${hotel.managerName}"></span>
                                    </td>
                                    <td>
                                        <span th:text="${hotel.managerEmail}"></span>
                                    </td>
                                    <td class="center">
                                        <span class="status-badge" th:text="${hotel.hotelRating}"></span>
                                    </td>
                                    <td class="center">
                                        <span class="status-badge" th:text="${#strings.capitalize(hotel.hotelStatus.name().toLowerCase())}"></span>
                                    </td>
                                    <td class="center">
                                        <span th:text="${hotel.hotelCity}"></span>
                                    </td>
                                    <td class="center">
                                        <span th:text="${hotel.hotelState}"></span>
                                    </td>
                                    <td class="center">
                                        <span th:text="${hotel.hotelCountry}"></span>
                                    </td>
                                    <td class="center">
                                        <div class="row-actions">
                                            <form th:action="@{/admin/hotels/status/{id}(id=${hotel.hotelId})}" method="post">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <button class="btn btn-danger" type="submit" th:if="${hotel.hotelStatus.name() == 'ACTIVE'}">Deactivate</button>
                                                <button class="btn btn-success" type="submit" th:if="!${hotel.hotelStatus.name() == 'ACTIVE'}">Activate</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:replace="~{fragments/table :: pagination(${page})}"></div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
