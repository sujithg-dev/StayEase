<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Users - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/manager.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>
    <div class="container dashboard">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="main-content">
            <section class="section">
                <div  class="empty-box" th:if="${#lists.isEmpty(users)}">
                    <h2 class="title">No users found!</h2>
                    <p class="subtitle">Registered users list will appear here.</p>
                </div>
                <div class="table-container" th:if="${!#lists.isEmpty(users)}">
                    <div class="table-header">
                        <div>
                            <h1 class="title">All Users</h1>
                            <p class="subtitle">All registered users</p>
                        </div>
                    </div>
                    <div class="table-filters">
                        <div class="search-box">
                            <span class="material-symbols-outlined icon">search</span>
                            <input type="text" placeholder="Search users . . .">
                        </div>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th class="center">Role</th>
                                    <th class="center">Status</th>
                                    <th class="center">Change Role</th>
                                    <th class="center">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${users}" th:if="${user.userRole.name() != 'ADMIN'}">
                                    <td>
                                        <span class="name" th:text="${user.userName}"></span>
                                    </td>
                                    <td>
                                        <span class="email" th:text="${user.userEmail}"></span>
                                    </td>
                                    <td class="center">
                                        <span class="status-badge" th:text="${user.userRole}"></span>
                                    </td>
                                    <td class="center">
                                        <span class="status-badge" th:text="${user.userStatus}"></span>
                                    </td>
                                    <td class="center">
                                        <div class="row-actions">
                                            <form class="role-form" th:action="@{/admin/users/role/{id}(id=${user.userId})}" method="post" th:if="${user.userId != adminId}">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <select class="input select" name="role"  th:disabled="${user.userId == #authentication.principal.username}">
                                                    <option value="CUSTOMER" th:selected="${user.userRole.name() == 'CUSTOMER'}">Customer</option>
                                                    <option value="MANAGER" th:selected="${user.userRole.name() == 'MANAGER'}">Manager</option>
                                                    <option value="ADMIN" th:selected="${user.userRole.name() == 'ADMIN'}">Admin</option>
                                                </select>
                                                <button class="btn btn-primary" type="submit">Change</button>
                                            </form>
                                        </div>
                                    </td>
                                    <td class="center">
                                        <div class="row-actions">
                                            <form th:action="@{/admin/users/status/{id}(id=${user.userId})}" method="post">
                                                <button class="btn btn-danger" type="submit" th:if="${user.userStatus.name() == 'ACTIVE'}">Disable</button>
                                                <button class="btn btn-success" type="submit" th:if="!${user.userStatus.name() == 'ACTIVE'}">Enable</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
