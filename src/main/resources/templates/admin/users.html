<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Users - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/manager.css}">
    <link rel="stylesheet" th:href="@{/css/table.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
    <script defer th:src="@{/js/sidebar-toggle.js}"></script>
    <script defer th:src="@{/js/table.js}"></script>
</head>

<body>
    <div class="container dashboard">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="main-content">
            <section class="section">
                <div class="empty-box" th:if="${#lists.isEmpty(allUsers)}">
                    <h2 class="title">No users found!</h2>
                    <p class="subtitle">Registered users list will appear here.</p>
                </div>
                <div class="table-container" data-table th:if="${page.totalElements > 0 or hasFilters}">
                    <div class="table-header">
                        <div>
                            <h1 class="title">All Users</h1>
                            <p class="subtitle">List of all registered users</p>
                        </div>
                    </div>
                    <form class="table-filters" data-table-form>
                        <div class="search-box">
                            <span class="material-symbols-outlined icon">search</span>
                            <input type="text" name="q" th:value="${q}" placeholder="Search users . . .">
                        </div>
                        <div class="filter-box">
                            <span class="material-symbols-outlined icon">filter_alt</span>
                            <select class="filter-select" name="role">
                                <option class="default" value="">All Roles</option>
                                <option th:each="p : ${userRoles}" th:value="${p.name()}" th:text="${#strings.capitalize(p.name().toLowerCase())}" th:selected="${p.name() == role}"></option>
                            </select>
                        </div>
                        <div class="filter-box">
                            <span class="material-symbols-outlined icon">filter_alt</span>
                            <select class="filter-select" name="status">
                                <option class="default" value="">All Statuses</option>
                                <option th:each="s : ${userStatuses}" th:value="${s.name()}" th:text="${#strings.capitalize(s.name().toLowerCase())}" th:selected="${s.name() == status}"></option>
                            </select>
                        </div>
                        <button class="filter-reset" type="button" th:if="${hasFilters}" data-reset>Reset</button>
                    </form>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th th:replace="~{fragments/table :: sortTh('Name','userName','')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('Email','userEmail','')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('Role','userRole','center')}"></th>
                                    <th th:replace="~{fragments/table :: sortTh('Status','userStatus','center')}"></th>
                                    <th class="center">Change Role</th>
                                    <th class="center">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(users)}">
                                    <td colspan="10" style="text-align:center;padding:24px;">No matching records found</td>
                                </tr>
                                <tr th:each="user : ${users}">
                                    <td>
                                        <span th:text="${user.userName}"></span>
                                    </td>
                                    <td>
                                        <span th:text="${user.userEmail}"></span>
                                    </td>
                                    <td class="center">
                                        <span class="status-badge" th:text="${#strings.capitalize(user.userRole.name().toLowerCase())}"></span>
                                    </td>
                                    <td class="center">
                                        <span class="status-badge" th:text="${#strings.capitalize(user.userStatus.name().toLowerCase())}"></span>
                                    </td>
                                    <td class="center">
                                        <div class="row-actions">
                                            <form class="role-form" th:action="@{/admin/users/role/{id}(id=${user.userId})}" method="post" th:if="${user.userId != adminId}">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <select class="input select" name="role"  th:disabled="${user.userId == #authentication.principal.username}">
                                                    <option value="CUSTOMER" th:selected="${user.userRole.name() == 'CUSTOMER'}">Customer</option>
                                                    <option value="MANAGER" th:selected="${user.userRole.name() == 'MANAGER'}">Manager</option>
                                                    <option value="ADMIN" th:selected="${user.userRole.name() == 'ADMIN'}">Admin</option>
                                                </select>
                                                <button class="btn btn-primary" type="submit">Change</button>
                                            </form>
                                        </div>
                                    </td>
                                    <td class="center">
                                        <div class="row-actions">
                                            <form th:action="@{/admin/users/status/{id}(id=${user.userId})}" method="post">
                                                <button class="btn btn-danger" type="submit" th:if="${user.userStatus.name() == 'ACTIVE'}">Disable</button>
                                                <button class="btn btn-success" type="submit" th:if="!${user.userStatus.name() == 'ACTIVE'}">Enable</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:replace="~{fragments/table :: pagination(${page})}"></div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
