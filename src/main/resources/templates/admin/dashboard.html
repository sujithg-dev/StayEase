<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/manager.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>
    <div class="container dashboard">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="main-content">
            <section class="section">
                <div class="section-header">
                    <h1 class="title">Welcome, <span th:text="${user.userName}"></span></h1>
                </div>
                <div class="dashboard-stats">
                    <div class="stats-section">
                        <h3 class="stats-heading">Users overview</h3>
                        <div class="stats-grid">
                            <article class="stat-card">
                                <div class="stat-icon icon-blue"><i class="fa-solid fa-users"></i></div>
                                <div class="stat-info">
                                    <span class="stat-label">Total users</span>
                                    <strong class="stat-value" th:text="${userCount}">0</strong>
                                </div>
                            </article>
                            <article class="stat-card">
                                <div class="stat-icon icon-green"><i class="fa-solid fa-user"></i></div>
                                <div class="stat-info">
                                    <span class="stat-label">Customers</span>
                                    <strong class="stat-value" th:text="${customerCount}">0</strong>
                                </div>
                            </article>
                            <article class="stat-card">
                                <div class="stat-icon icon-purple"><i class="fa-solid fa-user-tie"></i></div>
                                <div class="stat-info">
                                    <span class="stat-label">Hotel Managers</span>
                                    <strong class="stat-value" th:text="${managerCount}">0</strong>
                                </div>
                            </article>
                        </div>
                    </div>
                    <div class="stats-section">
                        <h3 class="stats-heading">Hotel overview</h3>
                        <div class="stats-grid">
                            <article class="stat-card">
                                <div class="stat-icon icon-blue"><i class="fa-solid fa-hotel"></i></div>
                                <div class="stat-info">
                                    <span class="stat-label">Total hotels</span>
                                    <strong class="stat-value" th:text="${hotelCount}">0</strong>
                                </div>
                            </article>
                            <article class="stat-card">
                                <div class="stat-icon icon-green"><i class="fa-solid fa-circle-check"></i></div>
                                <div class="stat-info">
                                    <span class="stat-label">Active hotels</span>
                                    <strong class="stat-value" th:text="${activeHotelCount}">0</strong>
                                </div>
                            </article>
                            <article class="stat-card">
                                <div class="stat-icon icon-orange"><i class="fa-solid fa-circle-pause"></i></div>
                                <div class="stat-info">
                                    <span class="stat-label">Inactive hotels</span>
                                    <strong class="stat-value" th:text="${inactiveHotelCount}">0</strong>
                                </div>
                            </article>
                        </div>
                    </div>
                    <div class="stats-section">
                        <h3 class="stats-heading">Booking overview</h3>
                        <div class="stats-grid">
                            <article class="stat-card">
                                <div class="stat-icon icon-blue"><i class="fa-solid fa-calendar-check"></i></div>
                                <div class="stat-info">
                                    <span class="stat-label">Total bookings</span>
                                    <strong class="stat-value" th:text="${bookingCount}">0</strong>
                                </div>
                            </article>
                            <article class="stat-card">
                                <div class="stat-icon icon-green"><i class="fa-solid fa-check-double"></i></div>
                                <div class="stat-info">
                                    <span class="stat-label">Confirmed bookings</span>
                                    <strong class="stat-value" th:text="${confirmedBookingCount}">0</strong>
                                </div>
                            </article>
                            <article class="stat-card">
                                <div class="stat-icon icon-orange"><i class="fa-solid fa-clock"></i></div>
                                <div class="stat-info">
                                    <span class="stat-label">Pending payments</span>
                                    <strong class="stat-value" th:text="${pendingPaymentCount}">0</strong>
                                </div>
                            </article>
                            <article class="stat-card">
                                <div class="stat-icon icon-red"><i class="fa-solid fa-calendar-xmark"></i></div>
                                <div class="stat-info">
                                    <span class="stat-label">Cancelled bookings</span>
                                    <strong class="stat-value" th:text="${cancelledBookingCount}"></strong>
                                </div>
                            </article>
                            <article class="stat-card">
                                <div class="stat-icon icon-green"><i class="fa-solid fa-calendar-check"></i></div>
                                <div class="stat-info">
                                    <span class="stat-label">Completed bookings</span>
                                    <strong class="stat-value" th:text="${completedBookingCount}"></strong>
                                </div>
                            </article>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
