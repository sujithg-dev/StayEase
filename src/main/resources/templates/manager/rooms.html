<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Room - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/manager.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>
    <div class="container dashboard">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="main-content">
            <section class="section">
                <div class="back-wrapper">
                    <a class="back-button" th:href="@{/manager/hotels}"><span class="material-symbols-outlined">arrow_back</span></a>
                </div>
                <div class="section-header">
                    <h1 class="title" th:text="${hotel.hotelName}"></h1>
                    <div>
                        <a class="btn btn-primary" th:href="@{/manager/hotels/{hotelId}/rooms/add(hotelId=${hotel.hotelId})}">Add Room</a>
                    </div>
                </div>
                <div class="empty-box" th:if="${#lists.isEmpty(rooms)}">
                    <h2 class="title">No Rooms added yet!</h2>
                    <p class="subtitle">Added rooms will appear here.</p>
                </div>
                <div class="room-list" th:if="${!#lists.isEmpty(rooms)}">
                    <div class="room-card" th:each="room : ${rooms}">
                        <div class="room-image-box">
                            <img class="room-image" th:src="${room.roomCoverImage}" th:alt="${room.roomType}">
                        </div>
                        <div class="room-details">
                            <span class="room-status" th:classappend="${room.roomStatus.name() == 'AVAILABLE' ? 'active' : 'inactive'}" th:text="${#strings.capitalize(room.roomStatus.name().toLowerCase())}"></span>
                            <h3 class="room-name" th:text="${room.roomName}"></h3>
                            <div class="room-info">
                                <span class="row">
                                    <span class="label">Room Type</span>
                                    <span class="data" th:text="${room.roomType}"></span>
                                </span>
                                <span class="row">
                                    <span class="label">Capacity</span>
                                    <span class="data" th:text="${room.roomCapacity}"></span>
                                </span>
                                <span class="row">
                                    <span class="label">Total Rooms</span>
                                    <span class="data" th:text="${room.totalRooms}"></span>
                                </span>
                                <span class="row">
                                    <span class="label">Available Rooms</span>
                                    <span class="data" th:text="${room.availableRooms}"></span>
                                </span>
                            </div>
                            <div class="room-price">
                                <strong class="price" th:text="${'₹' + #numbers.formatDecimal(room.roomPrice, 0, 0)}"></strong>
                                <span class="unit">/ night</span>
                            </div>
                        </div>
                        <div class="room-actions">
                            <a class="btn btn-primary" th:href="@{/manager/hotels/{hotelId}/rooms/edit/{roomId}(hotelId=${hotel.hotelId},roomId=${room.roomId})}">Edit</a>
                            <form th:action="@{/manager/hotels/{hotelId}/rooms/delete/{roomId}(hotelId=${hotel.hotelId},roomId=${room.roomId})}" method="post" onsubmit="return confirm('Delete this room?');">
                                <button class="btn btn-danger" type="submit">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
