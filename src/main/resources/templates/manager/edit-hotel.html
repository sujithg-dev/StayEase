<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Hotel - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/manager.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>
    <div class="container dashboard">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="main-content">
            <section class="section">
                <div class="back-wrapper">
                    <a class="back-button" th:href="@{/manager/hotels}"><span class="material-symbols-outlined">arrow_back</span></a>
                </div>
                <div class="hotel-form-wrapper">
                    <div class="hotel-form">
                        <div class="form-header">
                            <h1 class="title">Edit Hotel</h1>
                        </div>
                        <form class="form form-edit-hotel" th:action="@{/manager/hotels/edit/{hotelId}(hotelId=${hotel.hotelId})}" th:object="${hotel}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" th:field="*{hotelId}">
                            <div class="input-group grid">
                                <div class="input-field">
                                    <label class="label required" for="hotelName">Hotel Name</label>
                                    <input class="input" id="hotelName" type="text" th:field="*{hotelName}" placeholder="Hotel name">
                                    <small class="input-error" th:errors="*{hotelName}"></small>
                                </div>
                                <div class="input-field">
                                    <label class="label required" for="hotelStatus">Hotel Status</label>
                                    <select class="input select" id="hotelStatus" th:field="*{hotelStatus}">
                                        <option value="ACTIVE">Active</option>
                                        <option value="INACTIVE">Inactive</option>
                                    </select>
                                </div>
                            </div>
                            <br>
                            <div class="input-group list">
                                <div class="input-field">
                                    <label class="label required" for="hotelDescription">Description</label>
                                    <textarea class="input textarea" id="hotelDescription" th:field="*{hotelDescription}" rows="3" placeholder="Describe your hotel"></textarea>
                                    <small class="input-error" th:if="${#fields.hasErrors('hotelDescription')}" th:errors="*{hotelDescription}"></small>
                                </div>
                            </div>
                            <br>
                            <div class="input-group grid">
                                <div class="input-field">
                                    <label class="label required" for="hotelStreet">Street</label>
                                    <input class="input" id="hotelStreet" type="text" th:field="*{hotelStreet}" placeholder="Street address">
                                    <small class="input-error" th:if="${#fields.hasErrors('hotelStreet')}" th:errors="*{hotelStreet}"></small>
                                </div>
                                <div class="input-field">
                                    <label class="label required" for="hotelCity">City</label>
                                    <input class="input" id="hotelCity" type="text" th:field="*{hotelCity}" placeholder="City">
                                    <small class="input-error" th:if="${#fields.hasErrors('hotelCity')}" th:errors="*{hotelCity}"></small>
                                </div>
                                <div class="input-field">
                                    <label class="label required" for="hotelState">State</label>
                                    <input class="input" id="hotelState" type="text" th:field="*{hotelState}" placeholder="State">
                                    <small class="input-error" th:if="${#fields.hasErrors('hotelState')}" th:errors="*{hotelState}"></small>
                                </div>
                                <div class="input-field">
                                    <label class="label required" for="hotelPincode">Pincode</label>
                                    <input class="input" id="hotelPincode" type="number" th:field="*{hotelPincode}" placeholder="Pincode">
                                    <small class="input-error" th:if="${#fields.hasErrors('hotelPincode')}" th:errors="*{hotelPincode}"></small>
                                </div>
                                <div class="input-field">
                                    <label class="label required" for="hotelCountry">Country</label>
                                    <input class="input" id="hotelCountry" type="text" th:field="*{hotelCountry}" placeholder="Country">
                                    <small class="input-error" th:if="${#fields.hasErrors('hotelCountry')}" th:errors="*{hotelCountry}"></small>
                                </div>
                                <div class="input-field">
                                    <label class="label required" for="hotelRating">Rating</label>
                                    <input class="input" id="hotelRating" type="number" th:field="*{hotelRating}" min="0" max="5" step="0.1" value="0" placeholder="Rate your hotel 1 to 5">
                                    <small class="input-error" th:if="${#fields.hasErrors('hotelRating')}" th:errors="*{hotelRating}"></small>
                                </div>
                                <div class="input-field">
                                    <label class="label" for="hotelPhone">Phone</label>
                                    <input class="input" id="hotelPhone" type="text" th:field="*{hotelPhone}" placeholder="Hotel Phone">
                                    <small class="input-error" th:if="${#fields.hasErrors('hotelPhone')}" th:errors="*{hotelPhone}"></small>
                                </div>
                                <div class="input-field">
                                    <label class="label" for="hotelEmail">Email</label>
                                    <input class="input" id="hotelEmail" type="email" th:field="*{hotelEmail}" placeholder="Hotel Email">
                                    <small class="input-error" th:if="${#fields.hasErrors('hotelEmail')}" th:errors="*{hotelEmail}"></small>
                                </div>
                            </div>
                            <br>
                            <div class="input-group list">
                                <div class="input-field">
                                    <label class="label">Select Amenities</label>
                                    <div class="multiple-check-field">
                                        <label class="amenity-option" th:each="amenity : ${amenities}">
                                            <input type="checkbox" name="hotelAmenities" th:value="${amenity.displayName}" th:checked="${hotel.hotelAmenities != null and #lists.contains(hotel.hotelAmenities, amenity.displayName)}">
                                            <span th:text="${amenity.displayName}"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="input-field">
                                    <label class="label" for="hotelPolicies">Policies</label>
                                    <textarea class="input textarea" id="hotelPolicies" name="hotelPolicies" rows="6" th:text="${hotel.hotelPolicies != null ? #strings.listJoin(hotel.hotelPolicies, '&#10;') : ''}" placeholder="Enter one policy per line&#10;&#10;Example:&#10;Check-in starts at 2:00 PM&#10;Check-out is before 11:00 AM&#10;Pets are not allowed"></textarea>
                                    <small>Enter each policy on a separate line.</small>
                                    <small class="input-error" th:if="${#fields.hasErrors('hotelPolicies')}" th:errors="*{hotelPolicies}"></small>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="btn btn-primary form-btn" type="submit">Update</button>
                            </div>
                        </form>
                    </div>
                    <div class="image-form">
                        <div class="form-header">
                            <h1 class="title">Hotel Images</h1>
                        </div>
                        <form class="form form-edit-image" th:action="@{/manager/hotels/edit/image/{id}(id=${hotel.hotelId})}" th:object="${hotel}" method="post" enctype="multipart/form-data">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="input-group list">
                                <div class="input-field">
                                    <label class="label" for="imageFiles">Add New Images</label>
                                    <input class="input" type="file" id="imageFiles" name="imageFiles" accept="image/jpeg,image/png,image/webp" multiple required>
                                    <small>Add minimun 5 hotel images with landscape</small>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="btn btn-primary form-btn" type="submit">Upload</button>
                            </div>
                        </form>
                        <div class="hotel-images" th:if="${hotel.hotelImages != null && !hotel.hotelImages.isEmpty()}">
                            <div class="hotel-image-item" th:each="image : ${hotel.hotelImages}">
                                <span class="tag" th:if="${hotel.hotelCoverImage == image}">Cover Image</span>
                                <img class="image" th:src="${image}" th:alt="${hotel.hotelName}">
                                <div class="image-actions" th:if="${hotel.hotelCoverImage != image}">
                                    <form th:action="@{/manager/hotels/{hotelId}/images/cover(hotelId=${hotel.hotelId})}" method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <input type="hidden" name="image" th:value="${image}">
                                        <button class="btn btn-primary" type="submit"  th:classappend="${hotel.hotelCoverImage == image ? 'active' : ''}" th:disabled="${hotel.hotelCoverImage == image}" th:text="${hotel.hotelCoverImage == image ? '' : 'Set as Cover'}"></button>
                                    </form>
                                    <form th:action="@{/manager/hotels/{hotelId}/images/delete(hotelId=${hotel.hotelId})}" method="post" onsubmit="return confirm('Delete this image?');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <input type="hidden" name="image" th:value="${image}">
                                        <button class="btn btn-danger" type="submit">Delete</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
