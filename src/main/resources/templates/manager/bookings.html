<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Bookings - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/manager.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>
    <div class="container dashboard">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="main-content">
            <section class="section">
                <div  class="empty-box" th:if="${#lists.isEmpty(bookings)}">
                    <h2 class="title">No bookings yet!</h2>
                    <p class="subtitle">Customer bookings will appear here.</p>
                </div>
                <div class="table-container" th:if="${!#lists.isEmpty(bookings)}">
                    <div class="table-header">
                        <div>
                            <h1 class="title">All Bookings</h1>
                            <p class="subtitle">List of all booking details</p>
                        </div>
                    </div>
                    <div class="table-filters">
                        <div class="search-box">
                            <span class="material-symbols-outlined icon">search</span>
                            <input type="text" placeholder="Search bookings . . .">
                        </div>
                    </div>
                    <div class="table-wrapper">
                        <table th:if="${!#lists.isEmpty(bookings)}">
                            <thead>
                                <tr>
                                    <th>Booking ID</th>
                                    <th>Customer</th>
                                    <th>Hotel</th>
                                    <th class="center">Total Amount</th>
                                    <th class="center">Payment Status</th>
                                    <th class="center">Booking Status</th>
                                    <th class="center">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="booking : ${bookings}">
                                    <td th:text="${booking.bookingNumber}"></td>
                                    <td>
                                        <strong class="name" th:text="${booking.customerName}"></strong>
                                        <small class="email" th:text="${booking.customerEmail}"></small>
                                    </td>
                                    <td th:text="${booking.hotelName}"></td>
                                    <td class="center"><span th:text="${'₹' + booking.totalAmount}"></span></td>
                                    <td class="center">
                                        <span th:if="${booking.paymentStatus.name() == 'PAID'}" >Paid</span>
                                        <span th:if="${booking.paymentStatus.name() == 'PENDING'}" >Pending</span>
                                        <span th:if="${booking.paymentStatus.name() == 'FAILED'}" >Failed</span>
                                        <span th:if="${booking.paymentStatus.name() == 'REFUNDED'}">Refunded</span>
                                    </td>
                                    <td class="center">
                                        <span th:if="${booking.bookingStatus.name() == 'PENDING_PAYMENT'}">Payment Pending</span>
                                        <span th:if="${booking.bookingStatus.name() == 'CONFIRMED'}">Confirmed</span>
                                        <span th:if="${booking.bookingStatus.name() == 'COMPLETED'}">Completed</span>
                                        <span th:if="${booking.bookingStatus.name() == 'CANCELLED'}">Canceled</span>
                                    </td>
                                    <td class="center">
                                        <div class="row-actions">
                                            <a class="btn btn-primary" th:href="@{/manager/bookings/{id}(id=${booking.bookingId})}">View</a>
                                            <form th:if="${booking.bookingStatus.name() == 'CONFIRMED' and booking.checkInDate != null and T(java.time.LocalDate).now().isBefore(booking.checkInDate)}" th:action="@{/customer/bookings/cancel/{id}(id=${booking.bookingId})}" method="post">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <button class="btn btn-danger" type="submit" onclick="return confirm('Are you sure you want to cancel this booking?');">Cancel</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
