<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Room - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/manager.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>
    <div class="container dashboard">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="main-content">
            <section class="section">
                <div class="back-wrapper">
                    <a class="back-button" th:href="@{/manager/hotels/{hotelId}/rooms(hotelId=${hotelId})}"><span class="material-symbols-outlined">arrow_back</span></a>
                </div>
                <div class="hotel-form-wrapper">
                    <div class="hotel-form">
                        <div class="form-header">
                            <h1 class="title">Edit Room</h1>
                        </div>
                        <form class="form form-edit-room" th:action="@{/manager/hotels/{hotelId}/rooms/edit/{roomId}(hotelId=${hotelId},roomId=${room.roomId})}" th:object="${room}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" th:field="*{roomId}">
                            <input type="hidden" th:field="*{hotelId}">
                            <div class="input-group list">
                                <div class="input-group grid">
                                    <div class="input-field">
                                        <label class="label required" for="roomName">Room Name</label>
                                        <input class="input" id="roomName" type="text" th:field="*{roomName}" placeholder="Room Name">
                                        <small class="input-error" th:if="${#fields.hasErrors('roomName')}" th:errors="*{roomName}"></small>
                                    </div>
                                    <div class="input-field">
                                        <label class="label required" for="roomType">Room Type</label>
                                        <select class="input select" id="roomType" th:field="*{roomType}">
                                            <option class="default" value="">Select room type</option>
                                            <option value="Single">Single</option>
                                            <option value="Double">Double</option>
                                            <option value="Deluxe">Deluxe</option>
                                            <option value="Suite">Suite</option>
                                            <option value="Family">Family</option>
                                            <option value="Villa">Villa</option>
                                        </select>
                                        <small class="input-error" th:if="${#fields.hasErrors('roomType')}" th:errors="*{roomType}"></small>
                                    </div>
                                    <div class="input-field">
                                        <label class="label required" for="roomStatus">Room Status</label>
                                        <select class="input select" id="roomStatus" th:field="*{roomStatus}">
                                            <option value="AVAILABLE">Available</option>
                                            <option value="UNAVAILABLE">Unavailable</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="input-field">
                                    <label class="label required" for="roomDescription">Description</label>
                                    <textarea class="input textarea" id="roomDescription" th:field="*{roomDescription}" rows="3" placeholder="Describe the room"></textarea>
                                    <small class="input-error" th:if="${#fields.hasErrors('roomDescription')}" th:errors="*{roomDescription}"></small>
                                </div>
                            </div>
                            <br>
                            <div class="input-group grid">
                                <div class="input-field">
                                    <label class="label required" for="roomPrice">Room Price</label>
                                    <input class="input" id="roomPrice" type="number" th:field="*{roomPrice}" min="1" step="0.01" placeholder="Price per night">
                                    <small class="input-error" th:if="${#fields.hasErrors('roomPrice')}" th:errors="*{roomPrice}"></small>
                                </div>
                                <div class="input-field">
                                    <label class="label required" for="roomCapacity">Room Capacity</label>
                                    <input class="input" id="roomCapacity" type="number" th:field="*{roomCapacity}" min="1" placeholder="No of Guests">
                                    <small class="input-error" th:if="${#fields.hasErrors('roomCapacity')}" th:errors="*{roomCapacity}"></small>
                                </div>
                                <div class="input-field">
                                    <label class="label required" for="totalRoom">Total Rooms</label>
                                    <input class="input" id="totalRoom" type="number" th:field="*{totalRooms}" min="1" placeholder="Total no of rooms">
                                    <small class="input-error" th:if="${#fields.hasErrors('totalRooms')}" th:errors="*{totalRooms}"></small>
                                </div>
                                <div class="input-field">
                                    <label class="label required" for="availableRoom">Available Rooms</label>
                                    <input class="input" id="availableRoom" type="number" th:field="*{availableRooms}" min="0" placeholder="Total no of available rooms">
                                    <small class="input-error" th:if="${#fields.hasErrors('availableRooms')}" th:errors="*{availableRooms}"></small>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="btn btn-primary form-btn" type="submit">Update</button>
                            </div>
                        </form>
                    </div>
                    <div class="image-form">
                        <div class="form-header">
                            <h1 class="title">Room Images</h1>
                        </div>
                        <form class="form form-edit-image" th:action="@{/manager/hotels/{hotelId}/rooms/edit/image/{roomId}(hotelId=${hotelId},roomId=${room.roomId})}" th:object="${room}" method="post" enctype="multipart/form-data">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="input-group list">
                                <div class="input-field">
                                    <label class="label" for="imageFiles">Add New Images</label>
                                    <input class="input" type="file" id="imageFiles" name="imageFiles" accept="image/jpeg,image/png,image/webp" multiple required>
                                    <small>Add minimun 5 hotel images with landscape</small>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="btn btn-primary form-btn" type="submit">Upload</button>
                            </div>
                        </form>
                        <div class="hotel-images" th:if="${room.roomImages != null && !room.roomImages.isEmpty()}">
                            <div class="hotel-image-item" th:each="image : ${room.roomImages}">
                                <span class="tag" th:if="${room.roomCoverImage == image}">Cover Image</span>
                                <img class="image" th:src="${image}" th:alt="${room.roomType}">
                                <div class="image-actions" th:if="${room.roomCoverImage != image}">
                                    <form th:action="@{/manager/hotels/{hotelId}/rooms/images/cover/{roomId}(hotelId=${hotelId},roomId=${room.roomId})}" method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <input type="hidden" name="image" th:value="${image}">
                                        <button class="btn btn-primary" type="submit"  th:classappend="${room.roomCoverImage == image ? 'active' : ''}" th:disabled="${room.roomCoverImage == image}" th:text="${room.roomCoverImage == image ? '' : 'Set as Cover'}"></button>
                                    </form>
                                    <form th:action="@{/manager/hotels/{hotelId}/rooms/images/delete/{roomId}(hotelId=${hotelId},roomId=${room.roomId})}" method="post" onsubmit="return confirm('Delete this image?');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <input type="hidden" name="image" th:value="${image}">
                                        <button class="btn btn-danger" type="submit">Delete</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
