<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Hotel Images - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/manager.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>
    <div class="container dashboard">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="main-content">
            <section class="section">
                <div class="back-wrapper">
                    <a class="back-button" th:href="@{/manager/dashboard}"><span class="material-symbols-outlined">arrow_back</span></a>
                </div>
                <div class="manager-form">
                    <div class="form-header">
                        <h1 class="title">Add Hotel</h1>
                    </div>
                    <form class="form form-add-hotel" th:action="@{/manager/hotels/add}" th:object="${hotel}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="input-group list">
                            <div class="input-field">
                                <label class="label required" for="imageFiles">Hotel Images</label>
                                <input class="input" type="file" id="imageFiles" name="imageFiles" accept="image/jpeg,image/png,image/webp" multiple>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-primary form-btn" type="submit">Add</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
