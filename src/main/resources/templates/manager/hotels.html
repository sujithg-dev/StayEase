<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manager Hotels - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/manager.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>
    <div class="container dashboard">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="main-content">
            <section class="section">
                <div class="section-header">
                    <h1 class="title"></h1>
                    <a class="btn btn-primary" th:href="@{/manager/hotels/add}">Add Hotel</a>
                </div>
                <div class="hotel-list" th:if="${!#lists.isEmpty(hotels)}">
                    <div class="hotel-card" th:each="hotel : ${hotels}">
                        <div class="hotel-image-box">
                            <img class="hotel-image" th:src="${hotel.hotelCoverImage}" th:alt="${hotel.hotelName}">
                        </div>
                        <div class="hotel-details">
                            <h2 class="hotel-status" th:classappend="${hotel.hotelStatus.name() == 'ACTIVE' ? 'active' : 'inactive'}" th:text="${#strings.capitalize(hotel.hotelStatus.name().toLowerCase())}"></h2>
                            <div class="title">
                                <h2 class="hotel-name" th:text="${hotel.hotelName}"></h2>
                                <div class="hotel-rating">
                                    <div class="rating rating-excellent" th:if="${hotel.hotelRating >= 4}">
                                        <span class="material-symbols-outlined icon">star_rate_half</span>
                                        <span class="rating-text" th:text="${hotel.hotelRating}"></span>
                                    </div>
                                    <div class="rating rating-good" th:if="${hotel.hotelRating >= 3 and hotel.hotelRating < 4}">
                                        <span class="material-symbols-outlined icon">star_rate_half</span>
                                        <span class="rating-text" th:text="${hotel.hotelRating}"></span>
                                    </div>
                                    <div class="rating rating-average" th:if="${hotel.hotelRating >= 2 and hotel.hotelRating < 3}">
                                        <span class="material-symbols-outlined icon">star_rate_half</span>
                                        <span class="rating-text" th:text="${hotel.hotelRating}"></span>
                                    </div>
                                    <div class="rating rating-bad" th:if="${hotel.hotelRating < 2}">
                                        <span class="material-symbols-outlined icon">star_rate_half</span>
                                        <span class="rating-text" th:text="${hotel.hotelRating}"></span>
                                    </div>
                                    <span class="review-count"></span>
                                </div>
                            </div>
                            <div class="hotel-location">
                                <span class="material-symbols-outlined icon">location_on</span>
                                <span class="address" th:text="${hotel.hotelCity + ', ' + hotel.hotelState}"></span>
                            </div>
                            <p class="hotel-description" th:text="${hotel.hotelDescription}"></p>
                            <div class="hotel-amenities" th:if="${hotel.hotelAmenities != null}">
                                <span class="amenity" th:each="hotelAmenity, stat : ${hotel.hotelAmenities}" th:if="${stat.index < 7}" th:text="${hotelAmenity}"></span>
                            </div>
                        </div>
                        <div class="hotel-actions">
                            <a class="btn btn-primary" th:href="@{/manager/hotels/{hotelId}/rooms(hotelId=${hotel.hotelId})}">Manage</a>
                            <a class="btn btn-primary" th:href="@{/manager/hotels/edit/{id} (id=${hotel.hotelId})}">Edit</a>
                            <form th:action="@{/manager/hotels/delete/{hotelId}(hotelId=${hotel.hotelId})}" method="post" onsubmit="return confirm('Delete this hotel?');">
                                <button class="btn btn-danger" type="submit">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="empty-box" th:if="${#lists.isEmpty(hotels)}">
                    <h2 class="title">No hotels found!</h2>
                    <p class="subtitle">Added hotels will appear here.</p>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
