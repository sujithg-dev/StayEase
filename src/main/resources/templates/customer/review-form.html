<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Hotel Review')}"></head>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Review - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/hotels.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>
    <div class="container">
        <div th:replace="~{fragments/customer-topbar :: customer-topbar}"></div>
        <main class="main-content">
            <section class="section">
                <div class="back-wrapper">
                    <a class="back-button" th:href="@{/bookings}"><span class="material-symbols-outlined">arrow_back</span></a>
                </div>
                <div class="review-form">
                    <div class="form-header">
                        <h1 class="title">Write a Review</h1>
                    </div>
                    <form th:action="@{/review/create}" method="post" th:object="${reviewRequest}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="bookingId" th:value="${bookingId}">
                        <div class="input-group list">
                            <div class="input-field">
                                <label class="label required" for="overallRating">Overall Rating</label>
                                <select class="input select" id="overallRating" th:field="*{overallRating}">
                                    <option class="default" value="">Select Rating</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                                <small class="input-error" th:if="${#fields.hasErrors('overallRating')}" th:errors="*{overallRating}"></small>
                            </div>
                        </div>
                        <br>
                        <div class="input-group grid">
                            <div class="input-field">
                                <label class="label required" for="cleanlinessRating">Cleanliness</label>
                                <select class="input select" id="cleanlinessRating" th:field="*{cleanlinessRating}">
                                    <option class="default" value="">Select Rating</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                                <small class="input-error" th:if="${#fields.hasErrors('cleanlinessRating')}" th:errors="*{cleanlinessRating}"></small>
                            </div>
                            <div class="input-field">
                                <label class="label required" for="locationRating">Location</label>
                                <select class="input select" id="locationRating" th:field="*{locationRating}">
                                    <option class="default" value="">Select Rating</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                                <small class="input-error" th:if="${#fields.hasErrors('locationRating')}" th:errors="*{locationRating}"></small>
                            </div>
                            <div class="input-field">
                                <label class="label required" for="comfortRating">Comfort</label>
                                <select class="input select" id="comfortRating" th:field="*{comfortRating}">
                                    <option class="default" value="">Select Rating</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                                <small class="input-error" th:if="${#fields.hasErrors('comfortRating')}" th:errors="*{comfortRating}"></small>
                            </div>
                            <div class="input-field">
                                <label class="label required" for="amenitiesRating">Amenities</label>
                                <select class="input select" id="amenitiesRating" th:field="*{amenitiesRating}">
                                    <option class="default" value="">Select Rating</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                                <small class="input-error" th:if="${#fields.hasErrors('amenitiesRating')}" th:errors="*{amenitiesRating}"></small>
                            </div>
                        </div>
                        <br>
                        <div class="input-group list">
                            <div class="input-field">
                                <label class="label required" for="feedback">Feedback</label>
                                <textarea class="input" id="feedback" th:field="*{feedback}" rows="5" placeholder="Share your experience . . ."></textarea>
                                <small class="input-error" th:if="${#fields.hasErrors('feedback')}" th:errors="*{feedback}"></small>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-primary form-btn" type="submit">Submit Review</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
