<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Hotel - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/booking.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>
    <div class="container">
        <div th:replace="~{fragments/customer-topbar :: customer-topbar}"></div>
        <main class="main-content">
            <section class="section">
                <div class="back-wrapper">
                    <a class="back-button" th:href="@{/hotels/{id}(id=${hotel.hotelId})}"><span class="material-symbols-outlined">arrow_back</span></a>
                </div>
                <div class="booking-form">
                    <div class="booking-header">
                        <h1 class="title">Book Your Stay</h1>
                        <p class="subtitle">Complete the details below to make your reservation.</p>
                    </div>
                    <div class="details">
                        <div class="row">
                            <span>Hotel</span>
                            <strong th:text="${hotel.hotelName}"></strong>
                        </div>
                        <div class="row">
                            <span>Location</span>
                            <strong th:text="${hotel.hotelStreet + ', ' + hotel.hotelCity + ', ' + hotel.hotelState}"></strong>
                        </div>
                        <div class="row">
                            <span>Room Type</span>
                            <strong th:text="${room.roomType}"></strong>
                        </div>
                        <div class="row">
                            <span>Room Capacity</span>
                            <strong th:text="${room.roomCapacity}"></strong>
                        </div>
                        <div class="row">
                            <span>Available Rooms</span>
                            <strong th:text="${room.totalRooms}"></strong>
                        </div>
                        <div class="row">
                            <span>Room Price</span>
                            <strong th:text="${'₹' + room.roomPrice + ' / night'}"></strong>
                        </div>
                    </div>
                    <div class="form-container">
                        <div class="form-text">
                            <p class="form-error" th:if="${error}" th:text="${error}"></p>
                        </div>
                        <br>
                        <form class="form form-hotel-booking" th:action="@{/bookings/create}" th:object="${bookingRequest}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="input-group grid">
                                <input type="hidden" name="hotelId" th:value="${hotel.hotelId}">
                                <input type="hidden" name="roomId" th:value="${room.roomId}">
                                <div class="input-field">
                                    <label class="label required" for="checkInDate">Check-in</label>
                                    <input class="input" id="checkInDate" type="date" th:field="*{checkInDate}" required>
                                    <small class="input-error" th:if="${#fields.hasErrors('checkInDate')}" th:errors="*{checkInDate}"></small>
                                </div>
                                <div class="input-field">
                                    <label class="label required" for="checkOutDate">Check-out</label>
                                    <input class="input" id="checkOutDate" type="date" th:field="*{checkOutDate}" required>
                                    <small class="input-error" th:if="${#fields.hasErrors('checkOutDate')}" th:errors="*{checkOutDate}"></small>
                                </div>
                                <div class="input-field">
                                    <label class="label required" for="totalGuests">Total Guests</label>
                                    <input class="input" id="totalGuests" type="text" th:field="*{totalGuests}" min="1" th:max="${room.roomCapacity}">
                                    <small class="input-error" th:if="${#fields.hasErrors('totalGuests')}" th:errors="*{totalGuests}"></small>
                                </div>
                                <div class="input-field">
                                    <label class="label required" for="totalRooms"> Total Rooms</label>
                                    <input class="input"  id="totalRooms" type="text" th:field="*{totalRooms}" min="1" th:max="${room.totalRooms}">
                                    <small class="input-error" th:if="${#fields.hasErrors('totalRooms')}" th:errors="*{totalRooms}"></small>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="btn btn-primary form-btn" type="submit">Confirm Booking</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
