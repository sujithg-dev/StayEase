<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/booking.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>
    <div class="container">
        <div th:replace="~{fragments/customer-topbar :: customer-topbar}"></div>
        <main class="main-content">
            <section class="section">
                <div class="payment-form">
                    <div class="form-header">
                        <h1 class="form-title">Complete Payment</h1>
                    </div>
                    <form class="form form-payment" th:action="@{/payment/create}" th:object="${paymentRequest}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="input-group">
                            <input type="hidden" name="bookingId" th:value="${bookingId}">
                            <div class="input-field">
                                <label class="label" for="paymentMethod">Payment Method</label>
                                <select class="input select" id="paymentMethod" th:field="*{paymentMethod}">
                                    <option class="default" value="">Select Payment Method</option>
                                    <option value="UPI">UPI</option>
                                    <option value="Credit Card">Credit Card</option>
                                    <option value="Debit Card">Debit Card</option>
                                    <option value="Online Banking">Online Banking</option>
                                </select>
                                <small class="input-error" th:if="${#fields.hasErrors('paymentMethod')}" th:errors="*{paymentMethod}"></small>
                            </div>
                        </div>
                        <div class="form-actions">
                            <a class="btn btn-danger form-btn" th:href="@{/hotels/search}">Cancel</a>
                            <button class="btn btn-primary form-btn" type="submit">Pay Now</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
