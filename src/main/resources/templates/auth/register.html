<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>
    <div class="auth-page">
        <div class="auth-content">
            <div class="auth-form">
                    <div class="form-header">
                        <h1 class="logo">Stay<span>Ease</span></h1>
                        <p class="subtitle">Create New Account</p>
                    </div>
                    <div class="form-text">
                        <p class="form-message" th:if="${message}" th:text="${message}"></p>
                        <p class="form-error" th:if="${error}" th:text="${error}"></p>
                    </div>
                    <form class="form form-register" th:action="@{/register}" th:object="${registerRequest}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="input-group list">
                            <div class="input-field">
                                <label class="label required" for="userName">Name</label>
                                <input class="input" id="userName" type="text" th:field="*{userName}" placeholder="Enter your name" required>
                                <small class="input-error" th:errors="*{userName}"></small>
                            </div>
                            <div class="input-field">
                                <label class="label required" for="userEmail">Email Address</label>
                                <input class="input" id="userEmail" type="email" th:field="*{userEmail}" placeholder="Enter your email address" required>
                                <small class="input-error" th:errors="*{userEmail}"></small>
                            </div>
                            <div class="input-field">
                                <label class="label required" for="userPassword">Password</label>
                                <input class="input" id="userPassword" type="password" th:field="*{userPassword}" placeholder="Enter password" required>
                                <small class="input-error" th:errors="*{userPassword}"></small>
                                <button class="password-toggle" type="button" onclick="togglePassword('userPassword', this)"><span class="material-symbols-outlined">password_2</span></button>
                            </div>
                            <div class="input-field">
                                <label class="label required" for="userConfirmPassword">Confirm Password</label>
                                <input class="input" id="userConfirmPassword" type="password" th:field="*{userConfirmPassword}" placeholder="Enter Confirm password" required>
                                <small class="input-error" th:errors="*{userConfirmPassword}"></small>
                                <button class="password-toggle" type="button" onclick="togglePassword('userConfirmPassword', this)"><span class="material-symbols-outlined">password_2</span></button>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-primary form-btn" type="submit">Register</button>
                        </div>
                    </form>
                    <div class="form-tip">
                        <p>Already have an account?</p>
                        <a class="form-link" th:href="@{/login}">Login</a>
                    </div>
                </div>
        </div>
    </div>
</body>

</html>
