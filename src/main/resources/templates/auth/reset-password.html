<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>
    <div class="auth-page">
        <div class="auth-content">
            <div class="auth-form">
                <div class="form-header">
                    <div class="logo">
                        <h2 class="logo-name">Stay<span>Ease</span></h2>
                        <p class="logo-description">Hotel Reservation Platform</p>
                    </div>
                    <p class="title">Reset Password</p>
                    <p class="subtitle">Create a new password for your account.</p>
                </div>
                <div class="form-text">
                    <p class="form-message" th:if="${message}" th:text="${message}"></p>
                    <p class="form-error" th:if="${error}" th:text="${error}"></p>
                </div>
                <form class="form form-rest-password" th:action="@{/reset-password}" th:object="${resetPasswordRequest}" th:if="${token != null}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="token" th:value="${token}">
                    <div class="input-group list">
                        <div class="input-field">
                            <label class="label" for="newPassword">New Password</label>
                            <input class="input" id="newPassword" type="password" th:field="*{newPassword}" placeholder="Enter new password">
                            <small class="input-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></small>
                        </div>
                        <div class="input-field">
                            <label class="label" for="confirmPassword">Confirm Password</label>
                            <input class="input" id="confirmPassword" type="password" th:field="*{confirmPassword}" placeholder="Confirm new password">
                            <small class="input-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>
                            <button class="password-toggle" type="button" onclick="togglePassword('confirmPassword', this)"><span class="material-symbols-outlined">password_2</span></button>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-primary form-btn" type="submit">Reset Password</button>
                    </div>
                </form>
                <div class="form-tip" th:if="${token == null}">
                    <a class="link form-link" th:href="@{/forgot-password}">Request a new reset link</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
