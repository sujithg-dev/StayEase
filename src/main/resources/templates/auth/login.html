<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>
    <div class="auth-page">
        <div class="auth-content">
            <div class="auth-form">
                    <div class="form-header">
                        <div class="logo">
                            <h2 class="logo-name">Stay<span>Ease</span></h2>
                            <p class="logo-description">Hotel Reservation Platform</p>
                        </div>
                    </div>
                    <div class="form-text">
                        <p class="form-message" th:if="${message}" th:text="${message}"></p>
                        <p class="form-error" th:if="${error}" th:text="${error}"></p>
                    </div>
                    <form class="form form-login" th:action="@{/login}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="input-group list">
                            <div class="input-field">
                                <label class="label required" for="username">Email Address</label>
                                <input class="input" id="username" name="username" type="email" placeholder="someone@gmail.com" required>
                            </div>
                            <div class="input-field">
                                <label class="label required" for="password">Password</label>
                                <input class="input" id="password" name="password" type="password" placeholder="Enter password" required>
                                <button class="password-toggle" type="button" onclick="togglePassword('password', this)"><span class="material-symbols-outlined">password_2</span></button>
                                <a class="form-link forgot-link" th:href="@{forgot-password}">Forgot password?</a>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-primary form-btn" type="submit">Login</button>
                        </div>
                    </form>
                    <div class="form-tip">
                        <p>Don't have an account?</p>
                        <a class="form-link" th:href="@{/register}">Register</a>
                    </div>
                </div>
        </div>
    </div>
</body>

</html>
