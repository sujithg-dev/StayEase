<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/manager.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>
    <div class="container">
        <div th:replace="~{fragments/customer-topbar :: customer-topbar}" sec:authorize="hasRole('CUSTOMER')"></div>
        <div th:replace="~{fragments/topbar :: topbar}" sec:authorize="hasAnyRole('MANAGER', 'ADMIN')"></div>
        <main class="main-content">
            <section class="section section-profile">
                <div class="back-wrapper">
                    <a class="back-button" th:href="@{/main}"><span class="material-symbols-outlined icon">arrow_back</span></a>
                </div>
                <div class="profile-container">
                    <div class="profile-card">
                        <div class="profile-image">
                            <span class="avatar" th:text="${#strings.contains(user.userName, ' ') ? #strings.substring(user.userName, 0, 1) + #strings.substring(user.userName, #strings.indexOf(user.userName, ' ') + 1, #strings.indexOf(user.userName, ' ') + 2) : #strings.substring(user.userName, 0, 2)}"></span>
                        </div>
                        <div class="profile-details">
                            <h2 class="user-name" th:text="${user.userName}"></h2>
                            <p class="user-email" th:text="${user.userEmail}"></p>
                        </div>
                    </div>
                    <div class="profile-form">
                        <div class="form-header">
                            <h2 class="title">Profile Information</h2>
                            <p class="subtitle">Update your personal information</p>
                        </div>
                        <div class="form-text">
                            <p class="form-message" th:if="${param.updated}">Profile updated successfully.</p>
                        </div>
                        <form class="form form-profile" th:action="@{/profile/update}" th:object="${profileRequest}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="input-group list">
                                <div class="input-field">
                                    <label class="label required" for="name">Name</label>
                                    <input class="input" id="name" type="text" th:field="*{userName}" placeholder="Enter your name">
                                    <small class="input-error" th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}"></small>
                                </div>
                                <div class="input-field">
                                    <label class="label" for="email">Email</label>
                                    <input class="input" id="email" type="email" th:value="${user.userEmail}" readonly>
                                </div>
                                <div class="input-field">
                                    <label class="label" for="role">Account Type</label>
                                    <input class="input" id="role" type="text" th:value="${user.userRole}" readonly>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="btn btn-primary form-btn" type="submit">Save</button>
                            </div>
                        </form>
                        <div class="form-tip">
                            <span>Want to change your password?</span>
                            <a class="link form-link" th:href="@{/profile/password}">Change Password</a>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
