<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password - StayEase</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/manager.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>
    <div class="container">
        <div th:replace="~{fragments/customer-topbar :: customer-topbar}" sec:authorize="hasRole('CUSTOMER')"></div>
        <div th:replace="~{fragments/topbar :: topbar}" sec:authorize="hasAnyRole('MANAGER', 'ADMIN')"></div>
        <main class="main-content">
            <section class="section section-change-password">
                <div class="back-wrapper">
                    <a class="back-button" th:href="@{/profile}"><span class="material-symbols-outlined icon">arrow_back</span></a>
                </div>
                <div class="password-form">
                    <div class="form-header">
                        <h2 class="title">Change Password</h2>
                        <p class="subtitle">Enter your current password and choose a new password.</p>
                    </div>
                    <div class="form-text">
                        <p class="form-message" th:if="${param.updated}">Password changed successfully.</p>
                        <p class="form-error" th:if="${error}" th:text="${errorMessage}"></p>
                    </div>
                    <form th:action="@{/profile/password}" th:object="${changePasswordRequest}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="input-group list">
                            <div class="input-field">
                                <label class="label required" for="currentPassword">Current Password</label>
                                <input class="input" id="currentPassword" type="password" th:field="*{currentPassword}" placeholder="Enter current password">
                                <small class="input-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></small>
                                <button class="password-toggle" type="button" onclick="togglePassword('currentPassword', this)"><span class="material-symbols-outlined">password_2</span></button>
                            </div>
                            <div class="input-field">
                                <label class="label required" for="newPassword">New Password</label>
                                <input class="input" id="newPassword" type="password" th:field="*{newPassword}" placeholder="Enter new password">
                                <small class="input-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></small>
                                <button class="password-toggle" type="button" onclick="togglePassword('newPassword', this)"><span class="material-symbols-outlined">password_2</span></button>
                            </div>
                            <div class="input-field">
                                <label class="label required" for="confirmPassword">Confirm New Password</label>
                                <input class="input" id="confirmPassword" type="password" th:field="*{confirmPassword}" placeholder="Confirm new password">
                                <small class="input-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>
                                <button class="password-toggle" type="button" onclick="togglePassword('confirmPassword', this)"><span class="material-symbols-outlined">password_2</span></button>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-primary form-btn" type="submit">Change Password</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
