<div th:fragment="results">
    <div class="search-summary">
        <div class="search-summary-header">
            <div>
                <h2>Hotels</h2>
                <span>
                    <strong th:text="${#lists.size(hotels)}">0</strong>hotels found
                </span>
            </div>
        </div>

        <div class="applied-filters">
            <span class="filter-label">Your search:</span>
            <span class="filter-chip" th:if="${searchRequest.city != null and !#strings.isEmpty(searchRequest.city)}">
                <i class="fas fa-location-dot"></i>
                <span th:text="${searchRequest.city}">Chennai</span>
            </span>
            <span class="filter-chip" th:if="${searchRequest.minPrice != null}">
                ₹<span th:text="${searchRequest.minPrice}">1000</span>min
            </span>
            <span class="filter-chip" th:if="${searchRequest.maxPrice != null}">
                ₹<span th:text="${searchRequest.maxPrice}">10000</span>max
            </span>
            <span class="filter-chip" th:if="${searchRequest.guests != null}">
                <i class="fas fa-users"></i>
                <span th:text="${searchRequest.guests}">5</span>guests
            </span>
            <span class="filter-chip" th:each="amenity : ${searchRequest.amenities}" th:if="${searchRequest.amenities != null}">
                <i class="fas fa-check"></i>
                <span th:text="${amenity}">Swimming Pool</span>
            </span>
            <span class="filter-chip" th:if="${searchRequest.minRating != null}">
                <i class="fas fa-star"></i>
                <span th:text="${searchRequest.minRating}">4</span>& up
            </span>
        </div>

    </div>

    <div class="no-hotels" th:if="${#lists.isEmpty(hotels)}">
        <div class="no-hotels-icon">
            <i class="fas fa-hotel"></i>
        </div>
        <h3>No hotels found</h3>
        <p>Try changing your search filters.</p>
    </div>

    <div class="hotel-list" th:if="${!#lists.isEmpty(hotels)}">
        <div class="hotel-card" th:each="hotel : ${hotels}">
            <div>
                <img class="hotel-image" th:src="@{/assets/images/hotel.jpg}" alt="Hotel">
            </div>
            <div class="hotel-details">
                <span class="hotel-rating" th:text="${ '★ ' + hotel.hotelRating}"></span>
                <h2 class="hotel-name" th:text="${hotel.hotelName}"></h2>
                <p class="hotel-description" th:text="${hotel.hotelDescription}"></p>
                <div class="hotel-location">
                    <i class="fas fa-map-marker-alt"></i>
                    <span th:text="${hotel.hotelStreet + ', ' + hotel.hotelCity}"></span>
                </div>
                <div class="hotel-amenities" th:if="${hotel.hotelAmenities != null}">
                    <span th:each="hotelAmenity, stat : ${hotel.hotelAmenities}" th:if="${stat.index < 5}" th:text="${hotelAmenity}"></span>
                </div>
                <div class="hotel-actions">
                    <a class="btn btn-primary" th:href="@{/customer/hotels/{id}(id=${hotel.hotelId})}">See booking options</a>
                </div>
                <span class="hotel-price">starting price<strong>₹1200</strong></span>
            </div>
        </div>
    </div>
</div>
